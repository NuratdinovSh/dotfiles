[colors.selection]
text = "#FFFFFF"
background = "#30343F"

[colors.normal]
black = "#17181C"
red = "#e8998d"
green = "#8fb996"
yellow = "#f4d58d"
blue = "#bde0fe"
magenta = "#ea9ab2"
cyan = "#bde0fe"
white = "#D8DEE9"
